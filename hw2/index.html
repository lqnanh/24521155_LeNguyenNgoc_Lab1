<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit</title>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Drum Kit</h1>
  </header>

  <main id="main-content">
    <section aria-label="Drum pads" class="drum-grid">
      <button type="button" class="drum-pad" data-key="a" data-sound="sounds/kick.wav">
        <kbd>A</kbd> Kick
      </button>
      <button type="button" class="drum-pad" data-key="s" data-sound=" sounds/snare.wav">
        <kbd>S</kbd> Snare
      </button>
      <button type="button" class="drum-pad" data-key="d" data-sound="sounds/hicat.wav">
        <kbd>D</kbd> Hi-hat
      </button>
      <button type="button" class="drum-pad" data-key="f" data-sound="sounds/clap.wav">
        <kbd>F</kbd> Clap
      </button>
    </section>


    <section aria-label="Beat recorder">
      <h2>Beat Recorder</h2>
      <button type="button" id="btn-record">Record</button>
      <button type="button" id="btn-stop">Stop</button>
      <button type="button" id="btn-play">Play</button>
    </section>

  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
